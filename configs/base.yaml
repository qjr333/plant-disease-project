{
  "seed": 42,
  "device": "auto",
  "data": {
    "train_manifest": "data/splits/pv_train.csv",
    "val_manifest": "data/splits/pv_val.csv",
    "test_manifest": "data/splits/pv_test.csv",
    "external_manifest": "data/splits/plantdoc_external_test.csv",
    "image_size": 224,
    "mean": [0.485, 0.456, 0.406],
    "std": [0.229, 0.224, 0.225]
  },
  "training": {
    "epochs": 10,
    "batch_size": 32,
    "lr": 0.001,
    "weight_decay": 0.0001,
    "patience": 3,
    "num_workers": 0,
    "monitor": "macro_f1"
  },
  "model": {
    "name": "resnet18",
    "weights": "IMAGENET1K_V1",
    "finetuning": "freeze"
  },
  "augmentation": "basic"
}
