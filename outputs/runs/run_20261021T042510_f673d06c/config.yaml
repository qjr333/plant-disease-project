{
  "seed": 42,
  "device": "cpu",
  "data": {
    "train_manifest": "data/splits/pv_train.csv",
    "val_manifest": "data/splits/pv_val.csv",
    "test_manifest": "data/splits/pv_test.csv",
    "external_manifest": "data/splits/plantdoc_external_all.csv",
    "external_train_manifest": "data/splits/plantdoc_external_train.csv",
    "external_test_manifest": "data/splits/plantdoc_external_test.csv",
    "image_size": 224,
    "split_ratios": [
      0.7,
      0.15,
      0.15
    ],
    "mean": [
      0.485,
      0.456,
      0.406
    ],
    "std": [
      0.229,
      0.224,
      0.225
    ]
  },
  "training": {
    "epochs": 1,
    "batch_size": 8,
    "optimizer": "AdamW",
    "lr": 0.001,
    "lr_by_strategy": {
      "freeze": 0.001,
      "partial": 0.0001,
      "full": 0.0001
    },
    "weight_decay": 0.0001,
    "early_stopping": true,
    "patience": 3,
    "num_workers": 0,
    "monitor": "val_macro_f1"
  },
  "model": {
    "name": "resnet18",
    "weights": "IMAGENET1K_V1",
    "finetuning": "freeze"
  },
  "augmentation": "basic",
  "experiment_stage": "E1",
  "smoke_test": true,
  "smoke_limit": {
    "train_per_class": 2,
    "val_per_class": 1
  }
}
